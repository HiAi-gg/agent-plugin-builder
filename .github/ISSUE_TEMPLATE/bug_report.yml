name: Bug Report
description: Report a bug in Agent Plugin Builder
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Agent Plugin Builder version
      description: Output of `agent-plugin --version`
      placeholder: "0.0.1"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      description: OS and version
      placeholder: "macOS 15.2, Ubuntu 24.04, Windows 11"
    validations:
      required: true
  - type: input
    id: bun-version
    attributes:
      label: Bun version
      description: Output of `bun --version`
      placeholder: "1.3.14"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Minimal steps to reproduce the behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened. Include redacted output if relevant.
    validations:
      required: true
  - type: textarea
    id: fixture
    attributes:
      label: Minimal fixture
      description: If applicable, provide a minimal plugin directory or source project that reproduces the issue. Redact any sensitive information.
      render: shell
