name: Feature Request
description: Suggest a feature for Agent Plugins Builder
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve? What is the use case?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How should this work?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Any alternatives you considered?
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Links, references, or other context.
